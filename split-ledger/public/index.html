<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五人账本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F5F7F4;
    --surface: #FFFFFF;
    --surface2: #EDF1EC;
    --ink: #1C2823;
    --muted: #66756D;
    --line: #DCE3DC;
    --accent: #0E7B5C;
    --accent-ink: #FFFFFF;
    --pos: #0E7B5C;
    --neg: #BC4E2A;
    --chip-bg: #EDF1EC;
    --shadow: 0 1px 3px rgba(28,40,35,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141A17;
      --surface: #1D2521;
      --surface2: #242E29;
      --ink: #E7EDE8;
      --muted: #94A39A;
      --line: #303B35;
      --accent: #38B189;
      --accent-ink: #10241C;
      --pos: #45BD95;
      --neg: #E07A50;
      --chip-bg: #242E29;
      --shadow: 0 1px 3px rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    min-height: 100vh;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 56px; }

  header.app {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 20px 2px 12px;
  }
  header.app h1 { font-size: 21px; font-weight: 800; margin: 0; letter-spacing: .01em; }
  .sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .sync.ok .dot { background: var(--pos); }
  .sync.bad .dot { background: var(--neg); }

  nav.tabs {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;
    background: var(--surface2); border-radius: 12px; padding: 4px;
    position: sticky; top: 8px; z-index: 5;
  }
  nav.tabs button {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-weight: 600; padding: 9px 0; border-radius: 9px; cursor: pointer;
  }
  nav.tabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  nav.tabs button:focus-visible, .btn:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  main { margin-top: 18px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  .section-label {
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 20px 2px 8px;
  }
  .money { font-variant-numeric: tabular-nums; }

  /* ---- bills list ---- */
  .total-banner {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 4px 2px 12px;
  }
  .total-banner .amt { font-size: 26px; font-weight: 800; }
  .total-banner .lbl { color: var(--muted); font-size: 13px; }

  .bill { padding: 12px 16px; cursor: pointer; }
  .bill-row { display: flex; align-items: center; gap: 12px; }
  .bill-main { flex: 1; min-width: 0; }
  .bill-desc { font-weight: 700; overflow-wrap: anywhere; }
  .bill-sub { font-size: 12.5px; color: var(--muted); }
  .bill-amt { font-weight: 800; font-size: 17px; white-space: nowrap; }
  .bill-detail { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .bill-detail table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .bill-detail td { padding: 3px 0; }
  .bill-detail td:last-child { text-align: right; color: var(--muted); }
  .bill-actions { display: flex; gap: 8px; margin-top: 10px; }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 15px;
  }
  .avatar.sm { width: 24px; height: 24px; font-size: 11px; }

  .empty { text-align: center; color: var(--muted); padding: 36px 12px; }
  .empty .big { font-size: 34px; margin-bottom: 6px; }

  /* ---- form ---- */
  label.f { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 6px; }
  label.f:first-child { margin-top: 0; }
  input.txt {
    width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 10px; padding: 10px 12px; font: inherit;
  }
  input.txt:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .amount-wrap { position: relative; }
  .amount-wrap .cur { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; }
  .amount-wrap input { padding-left: 28px; font-size: 20px; font-weight: 700; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: flex; align-items: center; gap: 7px;
    border: 1.5px solid var(--line); background: var(--chip-bg); color: var(--ink);
    border-radius: 999px; padding: 6px 12px 6px 6px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .chip.on { border-color: var(--accent); background: var(--surface); box-shadow: var(--shadow); }
  .chip.off { opacity: .45; }

  .mode-toggle { display: inline-flex; background: var(--surface2); border-radius: 9px; padding: 3px; gap: 3px; }
  .mode-toggle button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; padding: 5px 14px; border-radius: 7px; cursor: pointer; }
  .mode-toggle button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .share-rows { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .share-row { display: flex; align-items: center; gap: 10px; }
  .share-row .nm { flex: 1; font-weight: 600; }
  .share-row input { width: 110px; text-align: right; }
  .share-left { font-size: 13px; margin-top: 8px; color: var(--muted); }
  .share-left.bad { color: var(--neg); font-weight: 700; }
  .share-left.good { color: var(--pos); font-weight: 700; }

  .btn {
    border: 0; border-radius: 11px; padding: 12px 18px; font: inherit; font-weight: 800;
    cursor: pointer; background: var(--accent); color: var(--accent-ink);
  }
  .btn.wide { width: 100%; margin-top: 20px; }
  .btn.ghost { background: var(--surface2); color: var(--ink); font-weight: 600; padding: 8px 14px; }
  .btn.danger { background: transparent; color: var(--neg); border: 1.5px solid var(--neg); font-weight: 700; padding: 7px 14px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .form-err { color: var(--neg); font-weight: 700; font-size: 13.5px; margin-top: 10px; }

  /* ---- settle ---- */
  .bal-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
  .bal-row + .bal-row { border-top: 1px solid var(--line); }
  .bal-name { flex: 1; font-weight: 700; }
  .bal-amt { font-weight: 800; }
  .bal-amt.pos { color: var(--pos); }
  .bal-amt.neg { color: var(--neg); }
  .bal-amt.zero { color: var(--muted); font-weight: 600; }
  .bal-tag { font-size: 12px; color: var(--muted); }

  .tr-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  .tr-row + .tr-row { border-top: 1px solid var(--line); }
  .tr-arrow { color: var(--muted); }
  .tr-amt { margin-left: auto; font-weight: 800; font-size: 16px; }
  .tr-name { font-weight: 700; }

  .batch { margin-bottom: 10px; }
  .batch summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  .batch summary .meta { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 8px; }
  .batch .tr-row { font-size: 14px; }

  .note { font-size: 13px; color: var(--muted); margin-top: 10px; }
  @media (prefers-reduced-motion: no-preference) {
    .card, .chip, nav.tabs button { transition: background .15s, border-color .15s, opacity .15s; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>五人账本</h1>
    <div class="sync" id="sync"><span class="dot"></span><span id="syncTxt">连接中…</span></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="bills" class="on">账单</button>
    <button data-tab="add">记一笔</button>
    <button data-tab="settle">结算</button>
  </nav>

  <main>
    <!-- ============ 账单 ============ -->
    <section id="view-bills">
      <div class="total-banner">
        <span class="lbl">本轮未结清支出</span>
        <span class="amt money" id="totalActive">$0.00</span>
      </div>
      <div id="billList"></div>
    </section>

    <!-- ============ 记一笔 ============ -->
    <section id="view-add" hidden>
      <div class="card">
        <label class="f" for="fDesc">这笔钱花在哪了</label>
        <input class="txt" id="fDesc" placeholder="比如：周五晚饭、Uber、超市" maxlength="60">

        <label class="f" for="fAmt">金额</label>
        <div class="amount-wrap">
          <span class="cur">$</span>
          <input class="txt money" id="fAmt" inputmode="decimal" placeholder="0.00">
        </div>

        <label class="f">谁付的钱</label>
        <div class="chips" id="payerChips"></div>

        <label class="f">谁参与分摊（点名字勾选）</label>
        <div class="chips" id="partChips"></div>

        <label class="f">怎么分</label>
        <div class="mode-toggle" id="modeToggle">
          <button data-mode="equal" class="on">平分</button>
          <button data-mode="custom">按金额</button>
        </div>
        <div id="customShares" hidden>
          <div class="share-rows" id="shareRows"></div>
          <div class="share-left" id="shareLeft"></div>
        </div>

        <div class="form-err" id="formErr" hidden></div>
        <button class="btn wide" id="submitBtn">记这一笔</button>
        <button class="btn ghost wide" id="cancelEditBtn" hidden style="margin-top:8px">取消编辑</button>
      </div>
    </section>

    <!-- ============ 结算 ============ -->
    <section id="view-settle" hidden>
      <div class="section-label">每人净余额</div>
      <div class="card" id="balCard"></div>

      <div class="section-label">最优转账方案</div>
      <div class="card" id="planCard"></div>

      <button class="btn wide" id="settleBtn" hidden>✓ 大家转完账了，标记本轮已结清</button>
      <button class="btn wide" id="settleConfirmBtn" hidden style="background:var(--neg);color:#fff">再点一次确认结清（账单将归档）</button>
      <div class="note" id="settleNote" hidden>结清后，本轮账单会移入下面的历史记录，账本从零开始记新一轮。</div>

      <div class="section-label" id="histLabel" hidden>已结清的历史</div>
      <div id="histList"></div>
    </section>
  </main>
</div>

<script>
"use strict";
/* ---------- 成员（写死，改名找 Claude） ---------- */
const MEMBERS = [
  { id: "eason",    name: "Eason",    c: "#3B82C4" },
  { id: "yiman",    name: "Yiman",    c: "#C2502E" },
  { id: "yuanyuan", name: "Yuanyuan", c: "#0E7B5C" },
  { id: "karson",   name: "Karson",   c: "#8B5CB8" },
  { id: "chen",     name: "Chen",     c: "#B8862B" },
];
const M = Object.fromEntries(MEMBERS.map(m => [m.id, m]));

/* ---------- 状态 ---------- */
let expenses = [];          // 所有账单（含已结清）
let batches = [];           // 结清批次
let version = 0;            // 服务器数据版本号
let editingId = null;       // 正在编辑的账单 id
let selPayer = MEMBERS[0].id;
let selParts = new Set(MEMBERS.map(m => m.id));
let splitMode = "equal";
const shareInput = {};      // 按金额模式下各自输入的字符串
let openBillId = null;      // 列表里展开的账单
let armSettle = false;
const armDel = new Set();   // 等待二次确认删除的账单 id

const $ = id => document.getElementById(id);
const fmt = c => (c < 0 ? "-$" : "$") + (Math.abs(c) / 100).toFixed(2);
const cents = s => {
  const v = parseFloat(String(s).replace(/[^0-9.]/g, ""));
  return isFinite(v) ? Math.round(v * 100) : NaN;
};
const when = iso => {
  try {
    return new Date(iso).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  } catch { return ""; }
};
function avatar(id, sm) {
  const m = M[id]; if (!m) return "";
  return '<span class="avatar' + (sm ? " sm" : "") + '" style="background:' + m.c + '">' + m.name[0] + "</span>";
}
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }

/* ---------- 与服务器同步 ---------- */
function setSync(state, txt) {
  const el = $("sync");
  el.className = "sync " + state;
  $("syncTxt").textContent = txt;
}
async function refresh(force) {
  try {
    const r = await fetch("api/state?v=" + (force ? 0 : version), { cache: "no-store" });
    if (r.status === 304) { setSync("ok", "已同步"); return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const s = await r.json();
    version = s.version;
    expenses = s.expenses || [];
    batches = s.batches || [];
    for (const id of [...armDel]) if (!expenses.some(e => e.id === id)) armDel.delete(id);
    setSync("ok", "已同步");
    renderAll();
  } catch {
    setSync("bad", "连接失败，稍后自动重试");
  }
}
async function send(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: { "content-type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  await refresh(true);
}

/* ---------- 分摊计算（全部用“分”为单位的整数，避免小数误差） ---------- */
function sharesOf(exp) {
  const out = {};
  if (exp.mode === "custom" && exp.shares) {
    for (const id of exp.parts) out[id] = exp.shares[id] || 0;
    return out;
  }
  const n = exp.parts.length;
  const base = Math.floor(exp.amount / n);
  let rem = exp.amount - base * n;
  const ordered = MEMBERS.map(m => m.id).filter(id => exp.parts.includes(id));
  for (const id of ordered) { out[id] = base + (rem > 0 ? 1 : 0); if (rem > 0) rem--; }
  return out;
}
function netBalances(list) {
  const net = Object.fromEntries(MEMBERS.map(m => [m.id, 0]));
  for (const e of list) {
    if (net[e.payer] === undefined) net[e.payer] = 0;
    net[e.payer] += e.amount;
    const sh = sharesOf(e);
    for (const id in sh) { if (net[id] === undefined) net[id] = 0; net[id] -= sh[id]; }
  }
  return net;
}

/* ---------- 最少转账次数（5人规模，穷举零和分组保证最优） ---------- */
function planTransfers(net) {
  const ids = Object.keys(net).filter(id => net[id] !== 0);
  const n = ids.length;
  if (n === 0) return [];
  const vals = ids.map(id => net[id]);
  const full = (1 << n) - 1;
  const sum = new Array(full + 1).fill(0);
  for (let m = 1; m <= full; m++) {
    const low = m & -m, i = Math.log2(low) | 0;
    sum[m] = sum[m ^ low] + vals[i];
  }
  // best[mask] = mask 内最多能拆出的零和小组数
  const best = new Array(full + 1).fill(0);
  const pick = new Array(full + 1).fill(0);
  for (let m = 1; m <= full; m++) {
    for (let s = m; s > 0; s = (s - 1) & m) {
      if (sum[s] === 0 && best[m ^ s] + 1 > best[m]) { best[m] = best[m ^ s] + 1; pick[m] = s; }
    }
  }
  // 还原分组，组内“最大债主配最大欠款人”贪心（组大小 k 只需 k-1 笔）
  const transfers = [];
  let m = full;
  while (m) {
    const s = pick[m] || m;
    const cred = [], debt = [];
    for (let i = 0; i < n; i++) if (s >> i & 1) {
      if (vals[i] > 0) cred.push({ id: ids[i], v: vals[i] });
      else debt.push({ id: ids[i], v: -vals[i] });
    }
    cred.sort((a, b) => b.v - a.v); debt.sort((a, b) => b.v - a.v);
    while (cred.length && debt.length) {
      const c = cred[0], d = debt[0];
      const amt = Math.min(c.v, d.v);
      transfers.push({ from: d.id, to: c.id, amount: amt });
      c.v -= amt; d.v -= amt;
      if (c.v === 0) cred.shift();
      if (d.v === 0) debt.shift();
      if (c.v) cred.sort((a, b) => b.v - a.v);
      if (d.v) debt.sort((a, b) => b.v - a.v);
    }
    m ^= s;
  }
  return transfers;
}

/* ---------- 渲染 ---------- */
const activeExps = () => expenses.filter(e => !e.settled).sort((a, b) => (b.at || "").localeCompare(a.at || ""));

function renderAll() { renderBills(); renderSettle(); }

function renderBills() {
  const act = activeExps();
  $("totalActive").textContent = fmt(act.reduce((s, e) => s + e.amount, 0));
  const box = $("billList");
  if (!act.length) {
    box.innerHTML = '<div class="empty"><div class="big">🧾</div>还没有账单。<br>去「记一笔」把你付过的钱记进来吧。</div>';
    return;
  }
  box.innerHTML = act.map(e => {
    const open = e.id === openBillId;
    const sh = sharesOf(e);
    const names = e.parts.map(id => M[id] ? M[id].name : id).join("、");
    let detail = "";
    if (open) {
      detail = '<div class="bill-detail"><table>' +
        e.parts.map(id => '<tr><td>' + esc(M[id] ? M[id].name : id) + ' 应摊</td><td class="money">' + fmt(sh[id]) + "</td></tr>").join("") +
        "</table><div class='bill-actions'>" +
        '<button class="btn ghost" data-edit="' + e.id + '">✎ 编辑</button>' +
        (armDel.has(e.id)
          ? '<button class="btn danger" data-del2="' + e.id + '">确认删除？</button>'
          : '<button class="btn danger" data-del="' + e.id + '">删除</button>') +
        "</div></div>";
    }
    return '<div class="card bill" data-bill="' + e.id + '">' +
      '<div class="bill-row">' + avatar(e.payer) +
      '<div class="bill-main"><div class="bill-desc">' + esc(e.desc || "未命名") + '</div>' +
      '<div class="bill-sub">' + esc(M[e.payer] ? M[e.payer].name : e.payer) + " 付 · 分给 " + esc(names) +
      (e.mode === "custom" ? " · 按金额" : "") + " · " + when(e.at) + "</div></div>" +
      '<div class="bill-amt money">' + fmt(e.amount) + "</div></div>" + detail + "</div>";
  }).join("");
}

function renderSettle() {
  const act = activeExps();
  const net = netBalances(act);
  $("balCard").innerHTML = MEMBERS.map(m => {
    const v = net[m.id];
    const cls = v > 0 ? "pos" : v < 0 ? "neg" : "zero";
    const tag = v > 0 ? "应收回" : v < 0 ? "应付出" : "已平";
    return '<div class="bal-row">' + avatar(m.id) +
      '<span class="bal-name">' + m.name + '</span><span class="bal-tag">' + tag + '</span>' +
      '<span class="bal-amt money ' + cls + '">' + (v === 0 ? "—" : fmt(Math.abs(v))) + "</span></div>";
  }).join("");

  const plan = planTransfers(net);
  const planBox = $("planCard");
  const nm = id => M[id] ? M[id].name : id;
  if (!act.length) {
    planBox.innerHTML = '<div class="empty" style="padding:20px">本轮还没有账单。</div>';
  } else if (!plan.length) {
    planBox.innerHTML = '<div class="empty" style="padding:20px">🎉 大家正好两清，不需要转账！</div>';
  } else {
    planBox.innerHTML = plan.map(t =>
      '<div class="tr-row">' + avatar(t.from, true) + '<span class="tr-name">' + esc(nm(t.from)) + "</span>" +
      '<span class="tr-arrow">→</span>' + avatar(t.to, true) + '<span class="tr-name">' + esc(nm(t.to)) + "</span>" +
      '<span class="tr-amt money">' + fmt(t.amount) + "</span></div>"
    ).join("") + '<div class="note">共 ' + plan.length + " 笔转账即可全部结清（已是最少次数）。</div>";
  }

  $("settleBtn").hidden = !act.length || armSettle;
  $("settleConfirmBtn").hidden = !armSettle;
  $("settleNote").hidden = !act.length;

  const hist = [...batches].sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  $("histLabel").hidden = !hist.length;
  $("histList").innerHTML = hist.map(b =>
    '<details class="card batch"><summary>' + when(b.at) + " 结清" +
    '<span class="meta">' + (b.count || 0) + " 笔账单 · 共 " + fmt(b.total || 0) + "</span></summary>" +
    ((b.transfers || []).length
      ? b.transfers.map(t => '<div class="tr-row">' + avatar(t.from, true) + '<span class="tr-name">' + esc(nm(t.from)) +
        '</span><span class="tr-arrow">→</span>' + avatar(t.to, true) + '<span class="tr-name">' + esc(nm(t.to)) +
        '</span><span class="tr-amt money">' + fmt(t.amount) + "</span></div>").join("")
      : '<div class="note">当时正好两清，无需转账。</div>') +
    "</details>"
  ).join("");
}

/* ---------- 记一笔表单 ---------- */
function renderPayerChips() {
  $("payerChips").innerHTML = MEMBERS.map(m =>
    '<button type="button" class="chip' + (selPayer === m.id ? " on" : "") + '" data-payer="' + m.id + '">' +
    avatar(m.id, true) + m.name + "</button>").join("");
}
function renderPartChips() {
  $("partChips").innerHTML = MEMBERS.map(m =>
    '<button type="button" class="chip ' + (selParts.has(m.id) ? "on" : "off") + '" data-part="' + m.id + '">' +
    avatar(m.id, true) + m.name + (selParts.has(m.id) ? " ✓" : "") + "</button>").join("");
}
function renderShareRows() {
  const box = $("customShares");
  box.hidden = splitMode !== "custom";
  if (box.hidden) return;
  const ordered = MEMBERS.filter(m => selParts.has(m.id));
  $("shareRows").innerHTML = ordered.map(m =>
    '<div class="share-row">' + avatar(m.id, true) + '<span class="nm">' + m.name + "</span>" +
    '<input class="txt money" inputmode="decimal" placeholder="0.00" data-share="' + m.id + '" value="' + esc(shareInput[m.id] || "") + '"></div>'
  ).join("");
  updateShareLeft();
}
function updateShareLeft() {
  const total = cents($("fAmt").value);
  const el = $("shareLeft");
  if (!isFinite(total) || total <= 0) { el.textContent = "先在上面填总金额，再分配每人多少。"; el.className = "share-left"; return; }
  let used = 0;
  for (const id of selParts) { const v = cents(shareInput[id] || ""); if (isFinite(v)) used += v; }
  const left = total - used;
  if (left === 0) { el.textContent = "✓ 正好分完"; el.className = "share-left good"; }
  else if (left > 0) { el.textContent = "还剩 " + fmt(left) + " 没分配"; el.className = "share-left bad"; }
  else { el.textContent = "超出了 " + fmt(-left); el.className = "share-left bad"; }
}
function resetForm() {
  editingId = null;
  $("fDesc").value = ""; $("fAmt").value = "";
  selPayer = MEMBERS[0].id;
  selParts = new Set(MEMBERS.map(m => m.id));
  splitMode = "equal";
  for (const k in shareInput) delete shareInput[k];
  $("formErr").hidden = true;
  $("submitBtn").textContent = "记这一笔";
  $("cancelEditBtn").hidden = true;
  document.querySelectorAll("#modeToggle button").forEach(b => b.classList.toggle("on", b.dataset.mode === "equal"));
  renderPayerChips(); renderPartChips(); renderShareRows();
}
function loadIntoForm(e) {
  editingId = e.id;
  $("fDesc").value = e.desc || "";
  $("fAmt").value = (e.amount / 100).toFixed(2);
  selPayer = e.payer;
  selParts = new Set(e.parts);
  splitMode = e.mode === "custom" ? "custom" : "equal";
  for (const k in shareInput) delete shareInput[k];
  if (e.mode === "custom" && e.shares) for (const id in e.shares) shareInput[id] = (e.shares[id] / 100).toFixed(2);
  $("submitBtn").textContent = "保存修改";
  $("cancelEditBtn").hidden = false;
  document.querySelectorAll("#modeToggle button").forEach(b => b.classList.toggle("on", b.dataset.mode === splitMode));
  renderPayerChips(); renderPartChips(); renderShareRows();
  switchTab("add");
}
function showErr(msg) { const el = $("formErr"); el.textContent = msg; el.hidden = false; }

async function submitForm() {
  $("formErr").hidden = true;
  const amount = cents($("fAmt").value);
  if (!isFinite(amount) || amount <= 0) return showErr("请填写正确的金额。");
  if (!selParts.size) return showErr("至少要勾选一个参与分摊的人。");
  const body = {
    desc: $("fDesc").value.trim(),
    amount, payer: selPayer,
    parts: MEMBERS.map(m => m.id).filter(id => selParts.has(id)),
    mode: splitMode,
  };
  if (splitMode === "custom") {
    const shares = {}; let used = 0;
    for (const id of body.parts) {
      const v = cents(shareInput[id] || "");
      shares[id] = isFinite(v) && v > 0 ? v : 0;
      used += shares[id];
    }
    if (used !== amount) return showErr("每人金额加起来（" + fmt(used) + "）要正好等于总金额 " + fmt(amount) + "。");
    body.shares = shares;
  }
  const btn = $("submitBtn"); btn.disabled = true;
  try {
    if (editingId) await send("PUT", "api/expenses/" + editingId, body);
    else await send("POST", "api/expenses", body);
    resetForm();
    switchTab("bills");
  } catch (err) {
    showErr("保存失败，请检查网络后重试。");
  } finally { btn.disabled = false; }
}

async function doSettle() {
  const act = activeExps();
  if (!act.length) return;
  const plan = planTransfers(netBalances(act));
  const btn = $("settleConfirmBtn"); btn.disabled = true;
  try {
    await send("POST", "api/settle", { transfers: plan });
  } catch (err) {}
  armSettle = false; btn.disabled = false;
  renderSettle();
}

/* ---------- 事件 ---------- */
function switchTab(name) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  $("view-bills").hidden = name !== "bills";
  $("view-add").hidden = name !== "add";
  $("view-settle").hidden = name !== "settle";
  armSettle = false;
  if (name === "settle") renderSettle();
}
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) switchTab(b.dataset.tab);
});
$("payerChips").addEventListener("click", e => {
  const b = e.target.closest("[data-payer]");
  if (!b) return; selPayer = b.dataset.payer; renderPayerChips();
});
$("partChips").addEventListener("click", e => {
  const b = e.target.closest("[data-part]");
  if (!b) return;
  const id = b.dataset.part;
  if (selParts.has(id)) { if (selParts.size > 1) selParts.delete(id); }
  else selParts.add(id);
  renderPartChips(); renderShareRows();
});
$("modeToggle").addEventListener("click", e => {
  const b = e.target.closest("[data-mode]");
  if (!b) return; splitMode = b.dataset.mode;
  document.querySelectorAll("#modeToggle button").forEach(x => x.classList.toggle("on", x === b));
  renderShareRows();
});
$("shareRows").addEventListener("input", e => {
  const inp = e.target.closest("[data-share]");
  if (!inp) return; shareInput[inp.dataset.share] = inp.value; updateShareLeft();
});
$("fAmt").addEventListener("input", updateShareLeft);
$("submitBtn").addEventListener("click", submitForm);
$("cancelEditBtn").addEventListener("click", () => { resetForm(); switchTab("bills"); });

$("billList").addEventListener("click", async e => {
  const edit = e.target.closest("[data-edit]");
  if (edit) { const x = expenses.find(v => v.id === edit.dataset.edit); if (x) loadIntoForm(x); return; }
  const del1 = e.target.closest("[data-del]");
  if (del1) { armDel.add(del1.dataset.del); renderBills(); return; }
  const del2 = e.target.closest("[data-del2]");
  if (del2) {
    try { await send("DELETE", "api/expenses/" + del2.dataset.del2); } catch (err) {}
    armDel.delete(del2.dataset.del2);
    return;
  }
  const row = e.target.closest("[data-bill]");
  if (row) {
    const id = row.dataset.bill;
    armDel.clear();
    openBillId = openBillId === id ? null : id;
    renderBills();
  }
});
$("settleBtn").addEventListener("click", () => { armSettle = true; renderSettle(); });
$("settleConfirmBtn").addEventListener("click", doSettle);

/* ---------- 启动 ---------- */
resetForm();
renderAll();
refresh(true);
setInterval(() => refresh(false), 4000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(true); });
</script>
</body>
</html>
